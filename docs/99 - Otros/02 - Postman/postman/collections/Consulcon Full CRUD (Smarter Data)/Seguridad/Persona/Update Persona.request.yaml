    {
      "ci": "12345678",
      "nombreCompleto": "Juan Perez Updated",
      "fechaNacimiento": "1990-01-01",
      "sexo": "M",
      "estadoCivil": "Casado",
      "esActivo": true,
      "medioContactos": []
    }
order: 4000
