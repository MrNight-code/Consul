$kind: http-request
url: "{{baseUrl}}/api/FinancialConfig/penalties/{{condominioId}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{authToken}}
  X-Condominio-Id: "{{condominioId}}"
body:
  type: text
  content: |-
    {
        "graceDays": 5,
        "monthlyInterestRate": 2.5
    }
order: 2000
