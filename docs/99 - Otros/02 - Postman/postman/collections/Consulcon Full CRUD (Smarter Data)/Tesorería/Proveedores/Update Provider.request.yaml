$kind: http-request
description: |-
  Actualiza un proveedor existente. Retorna 204 No Content.

  **Nota:** El NIT no se puede modificar.
url: "{{baseUrl}}/api/providers/{{providerId}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{authToken}}
  X-Condominio-Id: "{{condominioId}}"
body:
  type: text
  content: |-
    {
      "legalName": "Empresa de Limpieza Actualizada S.R.L.",
      "phoneNumber": "77798765",
      "email": "nuevo@limpieza.com",
      "address": "Av. Nueva #456"
    }
order: 6000
